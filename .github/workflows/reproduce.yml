name: reproduce

# The claim this repo makes is that a stranger with no lake, no credentials and no feature
# cache can recompute every published number from the committed rows. This job is that
# stranger. It gets its own workflow so the README badge reads exactly that claim, since
# GitHub badges are per-workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recompute:
    name: recompute the published numbers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # No setup-python step: .python-version pins the interpreter and uv fetches it, so
      # the version this job runs on is the one a reader gets locally rather than one
      # named separately here and drifting from it.
      #
      # --locked refuses to re-resolve. If uv.lock disagrees with pyproject.toml the job
      # fails instead of quietly installing some other resolution, which is the whole
      # point of committing the lock: the stranger recomputes against the same scipy and
      # the same matplotlib as the run that published the numbers, not merely the same
      # version ranges.
      - run: uv sync --locked

      # Provenance, the placebo gate, the direction asymmetry, and the headline numbers
      # recomputed from the rows rather than read back out of the record.
      - run: uv run pytest -q

      # Then both notebooks, top to bottom: the essay and its appendix. Each asserts the
      # numbers its text quotes as it goes, and the appendix recomputes every published
      # number against the run records, so any drift raises and nbconvert exits non-zero.
      # Output goes to throwaway copies: re-executing regenerates every execution count
      # and every PNG, so diffing the committed notebooks would fail on noise rather than
      # on a number changing.
      - name: execute the notebooks
        run: |
          uv run jupyter nbconvert --execute --to notebook \
            --ExecutePreprocessor.timeout=600 \
            --output-dir "$RUNNER_TEMP" \
            notebooks/price-discovery.ipynb notebooks/appendix.ipynb
