name: reproduce

# The claim this repo makes is that a stranger with no lake, no credentials and no feature
# cache can recompute every published number from the committed rows. This job is that
# stranger. It gets its own workflow so the README badge reads exactly that claim, since
# GitHub badges are per-workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recompute:
    name: recompute the published numbers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # Provenance, the placebo gate, the direction asymmetry, and the headline numbers
      # recomputed from the rows rather than read back out of the record.
      - run: pytest -q

      # Then the notebook itself, top to bottom. It asserts its own numbers against the
      # run records as it goes, so any drift raises and nbconvert exits non-zero. Output
      # goes to a throwaway copy: re-executing regenerates every execution count and
      # every PNG, so diffing the committed notebook would fail on noise rather than on
      # a number changing.
      - name: execute the notebook
        run: |
          jupyter nbconvert --execute --to notebook \
            --ExecutePreprocessor.timeout=600 \
            --output-dir "$RUNNER_TEMP" --output executed.ipynb \
            notebooks/price-discovery.ipynb
